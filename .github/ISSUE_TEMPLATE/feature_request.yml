name: Feature request
description: Suggest an improvement to InkNest
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the reading or launcher workflow affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include relevant offline, accessibility or E-Ink constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
