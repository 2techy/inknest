name: Bug report
description: Report a reproducible problem with InkNest
body:
  - type: markdown
    attributes:
      value: |
        For usage questions, use Discussions. Report security issues privately using the Security tab.
        Do not attach private books, source databases, document URIs, credentials or unredacted logs.
  - type: input
    id: version
    attributes:
      label: InkNest version and build variant
      placeholder: 0.1.0-dev, debug or signed release, commit if known
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device and environment
      description: Include model, Android/firmware version, physical device or emulator, and KOReader version if relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Remove personal paths, document URIs and book contents.
