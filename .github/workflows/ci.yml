name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      upload_debug_apk:
        description: Upload the debug APK for one day
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
          gradle-home-cache-excludes: caches/build-cache-*
      - name: Check formatting
        run: bash ./gradlew spotlessCheck --console=plain
      - name: Run JVM tests
        run: bash ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest --console=plain
      - name: Run Android lint
        run: bash ./gradlew :app:lintDebug :app:lintRelease --console=plain
      - name: Build APKs and Android tests
        run: bash ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --console=plain
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failure-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload requested debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.upload_debug_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
