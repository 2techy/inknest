[versions]
# Build tooling
agp = "9.5.0"
kotlin = "2.4.21"

# AndroidX platform integration
activityCompose = "1.13.0"
coreKtx = "1.19.1"

# Compose UI (library versions are managed by the BOM)
composeBom = "2026.09.00"

# Testing: local JVM tests and Android instrumentation tests
junit = "4.13.2"
junitVersion = "1.3.0"

[libraries]
# AndroidX platform integration
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Compose UI: import the BOM as a platform before using these libraries
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# Local JVM tests
junit = { group = "junit", name = "junit", version.ref = "junit" }

# Android instrumentation tests
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }

[plugins]
# Android application build
android-application = { id = "com.android.application", version.ref = "agp" }

# Compose compiler (uses the shared Kotlin version)
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
