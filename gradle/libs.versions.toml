[versions]
# Build tooling
agp = "9.5.1"
kotlin = "2.4.21"

# Source formatting (build-time tools only)
spotless = "8.10.4"
ktlint = "1.8.0"

# AndroidX platform integration
activityCompose = "1.13.0"
appcompat = "1.8.0"
coreKtx = "1.19.1"

# Lifecycle state holders and structured concurrency
lifecycle = "2.11.0"
coroutines = "1.11.0"

# Persistence
datastorePreferences = "1.3.0"
room = "3.0.3"
sqlite = "2.7.1"
ksp = "2.3.13"

# Compose UI (library versions are managed by the BOM)
composeBom = "2026.09.00"

# KOReader Lua data parsing
luaj = "3.0.1"

# Testing: local JVM tests and Android instrumentation tests
junit = "4.13.2"
junitVersion = "1.3.0"
androidxTestRunner = "1.7.0"
benchmark = "1.5.0"
uiautomator = "2.4.1"
profileinstaller = "1.4.1"

[libraries]
# AndroidX platform integration
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Lifecycle and coroutines (kept separate from the Compose BOM)
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Persistence
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }

androidx-room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }

# Compose UI: import the BOM as a platform before using these libraries
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# KOReader data parsing (no platform standard globals)
luaj-jse = { module = "org.luaj:luaj-jse", version.ref = "luaj" }

# Local JVM tests
androidx-datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "datastorePreferences" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Android instrumentation tests
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }

# Release profiles and isolated performance instrumentation
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
# Deterministic formatting for Kotlin sources and Gradle scripts
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Android application build
android-test = { id = "com.android.test", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }

# Compose compiler (uses the shared Kotlin version)
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Room schema export and Kotlin symbol processing
room = { id = "androidx.room3", version.ref = "room" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
